#:schema ../../schemas/inclean.toml.schema.json

# inclean.toml - generated by `inclean init` / `inclean config new`.
#
# Full reference:
#   English: https://github.com/inaku-Gyan/inclean/blob/v{{CFG_VERSION}}/docs/configuration.md
#   Chinese: https://github.com/inaku-Gyan/inclean/blob/v{{CFG_VERSION}}/docs/configuration.zh-CN.md
#
# After editing:
#   inclean check config
#   inclean check
#   inclean diff
#   inclean apply
#
# Glob basics: patterns are full-string anchored; "*" does not cross "/",
# while "**" does. A leading unescaped "!" negates, and later matches win:
#   file_paths    = ["src/**/*", "!src/generated/**/*", "src/generated/keep.c"]
#   include_match = ["**", "!private/**", "private/allowed.h"]
# Escape a literal leading bang as '\!weird.h' in TOML single quotes.

[project]
# Project root relative to this file; all rule paths are relative to it.
# root = "."

# Written by the generator and used for compatibility checks.
version = "{{CFG_VERSION}}"
min_inclean_version = "{{MIN_COMPAT_CLI_VERSION}}"


# ----------------------------------------------------------------------------
# Base rule. Child rules can inherit it with `copied_from = "base"`.
# Uncomment and tailor the fields that match your project.
# ----------------------------------------------------------------------------
[[rule]]
name = "base"

# Source-file and include-argument matching.
# file_paths = ["src/**/*", "include/**/*"]
# file_suffixes = ["@std.c.extensions", "@std.cpp.extensions"]
# include_forms = ["quote"]
# include_match = ["**"]

# Optional header resolution. Directories are literal, not globs.
# include_directories = ["src", "src/internal"]
# include_resolved_match = ["**"]
# include_on_unresolved = "error"
# include_on_ambiguous = "error"

# Edits. Use "skip" when this rule only edits trailing comments.
# action = { type = "resolve", relative_to = "include", output_form = "quote" }
# trailing_comment = "skip"


# Effective defaults for a rule with no `copied_from`:
# [[rule]]
# name = "default"
#
# file_paths = ["**/*"]
# file_suffixes = ["@std.c.extensions", "@std.cpp.extensions"]
# include_forms = ["quote"]
# include_match = ["**"]
# include_directories = []
# include_resolved_match = ["**"]
# include_on_unresolved = "error"
# include_on_ambiguous = "error"
# action = "skip"
# trailing_comment = "skip"

