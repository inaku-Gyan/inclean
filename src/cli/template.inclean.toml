#:schema ../../schemas/inclean.toml.schema.json

# inclean.toml — generated by `inclean init` / `inclean config new`.
#
# After editing, run:
#   inclean check config                # validate config alone
#   inclean check                       # full pipeline dry run
#   inclean diff                        # show what apply would change
#   inclean apply                       # write the rewrites
#
# =============================================================================
# IMPORTANT — GLOB ANCHORING
# Every glob in this file (file_paths, include_match) is FULL-STRING
# ANCHORED. "foo.h" matches ONLY the literal "foo.h" — NOT "a/foo.h",
# NOT "any/dir/foo.h". To match a name at any depth, write "**/foo.h".
# "*" never crosses "/"; "**" does.
# =============================================================================
#
# Config cheat-sheet (written by inclean {{CFG_VERSION}})
# -------------------------
# Each rule has 4 text matching layers (all must pass), plus an optional
# include-directory resolution layer:
#   1. file_paths   — globset patterns relative to the project root
#                     (default ["**/*"]; see GLOB ANCHORING above)
#   2. file_suffixes — literal extensions like ".c" (default covers C+C++);
#                     skipped when file_paths is an exact literal path
#   3. include_forms — set of "quote" / "angle" / "macro" (default ["quote"])
#                     "macro" matches but action evaluation always errors
#   4. include_match — globset patterns over the stripped include argument
#                     (default ["**"]; see GLOB ANCHORING above)
#
# include_directories is NOT a glob — it's a list of literal directory
# paths under the project root. When non-empty, inclean probes each path
# after include_forms + include_match pass to find the include's actual
# header file. Resolution policies:
#   include_on_unresolved = "error" | "skip" | "allow"  (default "error")
#       error: fail the run; skip: this rule does not match; allow: keep
#       the rule matched for non-resolve actions. allow + resolve is invalid.
#   include_on_ambiguous = "error" | "skip" | "first"   (default "error")
#       error: fail the run; skip: this rule does not match; first: use the
#       first matching include_directories entry in declaration order.
#
# suppression_comments_regex (optional) marks off-limits source regions:
#   { block_start, block_end, line }  — regexes over each line's comment
#                                       body (delimiters stripped + trim)
#
# Six action types:
#   { type = "resolve", relative_to = "...", output_form? = "..." }
#       Rewrite using the header selected by include_directories, relative
#       to `relative_to`. Use ${current_file} to mean "the directory of
#       the file being edited."
#   { type = "replace", with = "...", output_form? = "..." }
#       Substitute the include argument with `with`.
#   { type = "keep", output_form? = "..." }
#       Leave argument unchanged; output_form may flip quote↔angle.
#   { type = "remove", keep_blank_line? = false, keep_trailing_comment? = true }
#       Delete the whole include line.
#   { type = "comment_out", style? = "//" | "/**/" }
#       Wrap the include line in a comment.
#   { type = "error", message = "..." }
#       Surface a configured error and exit 2.
#
# trailing_comment (optional):
#   { transform? = { match_styles?, content_regex?, action },
#     append_if_absent? = "..." }
# transform matches an existing same-line // or /* */ trailing comment.
# Defaults: match_styles = ["//", "/**/"], content_regex = ".*".
# transform.action is required and may replace/keep/remove/error; replace
# and keep accept output_style = "//" | "/**/" | "preserve".
# append_if_absent writes the literal text the user provides (delimiters
# and leading whitespace included) when the action's outcome leaves no
# trailing comment. It must stay on one line.
#
# Copy via `copied_from = "name"`:
# - The parent rule must be declared earlier. Chains are allowed because
#   the child copies the parent's already-resolved value.
# - Top-level fields the child omits inherit from the parent's resolved
#   value.
# - When the child writes a top-level object field, its INNER fields
#   default to schema defaults (null / disabled). Use ${copied} per inner
#   field to pull the parent's value explicitly.
# - Use ${copied} as an array element to splat the parent's whole list
#   at that position.
# - Use the whole-field form `field = "${copied}"` (as a string) to inherit
#   the parent's entire object verbatim. Valid only for `action`,
#   `suppression_comments_regex`, and `trailing_comment`.
#
# Default action when neither child nor any ancestor specifies one:
#   { type = "keep", output_form = "preserve" }
# i.e. do nothing. A rule with no `action = ...` is harmless.
#
# Built-in @std.* constants (used inside string lists, or in regex/
# template strings via the same @name syntax):
#   @std.c.extensions / @std.cpp.extensions
#   @std.c.header_extensions / @std.c.source_extensions
#   @std.cpp.header_extensions / @std.cpp.source_extensions
#   @std.c89.system_headers / @std.c95.system_headers / ...
#   @std.cpp17.system_headers / @std.cpp20.system_headers / ...
#   @std.cpp.c_compat_headers
#   @std.cpp17.system_headers_or   (alternation form, useful in regex)
#
# Placeholders inside action / trailing-comment templates:
#   ${current_file}  — project-relative path of the file being edited
#   ${original}      — the include argument (or trailing-comment body
#                      when used inside trailing_comment)
#   $$               — literal '$'
# ----------------------------------------------------------------------------

[project]
# Optional. - The project root directory. It is relative to this config
#             file; all rule path fields are then relative to that root.
#             Must resolve to an existing directory.
# + Default:
# root = "."

# Required. - CLI version that wrote this config. Used in the two-direction
#             compatibility check; written by `inclean init`.
version = "{{CFG_VERSION}}"

# Required. - Lowest inclean version that can correctly parse this config.
#             Written by `inclean init`.
min_inclean_version = "{{MIN_COMPAT_CLI_VERSION}}"


# ----------------------------------------------------------------------------
# A "base" rule. Other rules use `copied_from = "base"` to inherit its
# top-level fields. The settings below are a typical shape for a project
# whose internal headers live in `src/` but should be referenced via
# canonical paths in `include/`.
# ----------------------------------------------------------------------------
[[rule]]
name = "base"

# file_paths = ["src/**/*", "include/**/*"]
# file_suffixes = ["@std.c.extensions", "@std.cpp.extensions"]
# include_forms = ["quote"]
# include_match = ["**"]
# include_directories = ["src", "src/internal"]
# include_on_unresolved = "error"
# include_on_ambiguous = "error"
# action = { type = "resolve", relative_to = "include", output_form = "quote" }


