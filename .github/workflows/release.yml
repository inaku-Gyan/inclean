name: release

on:
  push:
    branches:
      - main
    tags:
      - v*.*.*

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: inclean

jobs:
  check-tag:
    name: validate SemVer tag
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: validate
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # SemVer 2.0.0 with required leading "v":
          # vMAJOR.MINOR.PATCH[-prerelease][+build]
          semver_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$'
          if [[ ! "$REF_NAME" =~ $semver_re ]]; then
            echo "::error::tag '$REF_NAME' is not valid SemVer (expected vMAJOR.MINOR.PATCH[-prerelease][+build])"
            exit 1
          fi
          echo "tag '$REF_NAME' is valid SemVer"

  verify:
    name: verify
    uses: ./.github/workflows/test.yml

  publish-crate:
    name: publish to crates.io
    needs: [verify, check-tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo publish
        run: cargo publish --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"

  publish-pypi:
    name: publish to PyPI
    needs: [verify, check-tag]
    uses: ./.github/workflows/release_pypi.yml
    permissions:
      id-token: write
      contents: read

  build-binaries:
    name: build ${{ matrix.target }}
    needs: publish-crate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: cargo build --release
        run: cargo build --release --target ${{ matrix.target }}

      - name: package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          stage="${BIN_NAME}-${{ matrix.target }}"
          mkdir -p "dist/${stage}"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "dist/${stage}/"
          cp README.md LICENSE "dist/${stage}/"
          tar -czf "dist/${stage}.tar.gz" -C dist "${stage}"
          rm -rf "dist/${stage}"

      - name: package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = "$env:BIN_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$stage" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/$env:BIN_NAME.exe" "dist/$stage/"
          Copy-Item README.md, LICENSE "dist/$stage/"
          Compress-Archive -Path "dist/$stage/*" -DestinationPath "dist/$stage.zip"
          Remove-Item -Recurse -Force "dist/$stage"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  gh-release:
    name: create GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  publish-winget:
    name: publish to WinGet
    needs: gh-release
    runs-on: windows-latest
    steps:
      - uses: vedantmgoyal2009/winget-releaser@v2
        with:
          identifier: inakuGyan.inclean
          installers-regex: '\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
