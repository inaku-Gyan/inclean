[project]
name = "inclean"
description = "A C/C++ #include path normalizer that rewrites includes to resolve cleanly against a minimal -I set."
readme = "README.md"
requires-python = ">=3.8"
license = "BSD-3-Clause"
authors = [{ name = "inaku", email = "inaku.gs@gmail.com" }]
classifiers = [
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Pre-processors",
]
dynamic = ["version"]

[project.urls]
Issues = "https://github.com/inaku-Gyan/inclean/issues"
Repository = "https://github.com/inaku-Gyan/inclean"

[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[tool.maturin]
bindings = "bin"
manifest-path = "Cargo.toml"
