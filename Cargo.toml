[package]
name = "inclean"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "A C/C++ #include path normalizer that rewrites includes to resolve cleanly against a minimal -I set."
repository = "https://github.com/inaku-Gyan/inclean"
readme = "README.md"
keywords = ["cpp", "include", "cli", "refactoring", "c"]
categories = ["command-line-utilities", "development-tools"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[profile.release]
strip = "symbols"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
console = "0.16.3"
globset = "0.4.18"
ignore = "0.4.25"
rayon = "1.12.0"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
similar = "3.1.0"
thiserror = "2.0.18"
toml = "1.1.2"
walkdir = "2.5.0"
