[package]
name = "inclean"
version = "0.4.0"
edition = "2024"
license = "BSD-3-Clause"
description = "A C/C++ #include path normalizer that rewrites includes to resolve cleanly against a minimal -I set."
repository = "https://github.com/inaku-Gyan/inclean"
authors = ["inaku <inaku.gs@gmail.com>"]
readme = "README.md"
keywords = ["cpp", "include", "cli", "refactoring", "c"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["schemas/", ".github/"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[profile.release]
strip = "symbols"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
console = "0.16.3"
globset = "0.4.18"
ignore = "0.4.25"
rayon = "1.12.0"
regex = "1.12.3"
schemars = { version = "1.0", features = ["preserve_order"] }
semver = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
similar = "3.1.0"
thiserror = "2.0.18"
toml = "1.1.2"

[dev-dependencies]
libtest-mimic = "0.8"

[[test]]
name = "golden"
path = "tests/run_golden_tests.rs"
harness = false

[lints.clippy]
too_many_arguments = "allow"
