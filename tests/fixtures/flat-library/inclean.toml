# Minimal fixture: a fake "flat" library whose internal sources include
# headers by basename (#include "foo.h") even though those headers live
# at include/mylib/internal/foo.h. After inclean, includes should resolve
# under -Iinclude.

[project]
root = "."

[[rule]]
name = "base"
paths = ["src/**", "include/**"]
forms = ["quote"]
allowed_include_dirs = ["include"]
original_include_dirs = ["include/mylib/internal"]

# A second rule that should not match anything here, used to verify the
# matching engine still considers all rules.
[[rule]]
name = "deprecated-old"
extends = "base"
match = '^old_(.+)$'
action = { type = "error", message = "deprecated: ${1}" }
