[project]
root = "."

# Base resolves via two original dirs and keeps includes (no rewrite). Two
# leaf rules use `match_resolved.under` to split routing: one rewrites
# includes that resolve under `public/`, the other handles those under
# `internal/`. Each include's basename is unique across the two dirs, so
# the resolver itself isn't ambiguous — disambiguation happens at the
# `under` filter on each leaf.

[[rule]]
name = "base"
paths = ["src/**"]
forms = ["quote"]
allowed_include_dirs = ["include"]
original_include_dirs = [
    "include/mylib/public",
    "include/mylib/internal",
]
action = { type = "keep" }

[[rule]]
name = "public"
extends = "base"
match_resolved = { under = "include/mylib/public" }
action = { type = "rewrite", to = "mylib/public/${resolved.basename}" }

[[rule]]
name = "internal"
extends = "base"
match_resolved = { under = "include/mylib/internal" }
action = { type = "rewrite", to = "mylib/internal/${resolved.basename}" }
