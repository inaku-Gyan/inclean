# Fixture exercising the four `trailing_comment` policies. Each rule
# narrows by `match_resolved.under` so a single include in main.c hits
# exactly one rule.

[project]
root = "."

[[rule]]
name = "base"
paths = ["src/**"]
forms = ["quote"]
allowed_include_dirs = ["include"]
original_include_dirs = [
    "include/mylib/internal",
    "include/mylib/private",
    "include/mylib/helper",
    "include/mylib/legacy",
]

[[rule]]
name = "internal-prepend"
extends = "base"
match_resolved = { under = "include/mylib/internal" }
trailing_comment = { text = "/* IWYU pragma: keep */", policy = "prepend" }

[[rule]]
name = "private-fill"
extends = "base"
match_resolved = { under = "include/mylib/private" }
trailing_comment = { text = "// IWYU pragma: private", policy = "fill_if_absent" }

[[rule]]
name = "helper-append"
extends = "base"
match_resolved = { under = "include/mylib/helper" }
trailing_comment = { text = "// IWYU pragma: associated", policy = "append" }

[[rule]]
name = "legacy-replace"
extends = "base"
match_resolved = { under = "include/mylib/legacy" }
trailing_comment = { text = "// IWYU pragma: export", policy = "replace" }
