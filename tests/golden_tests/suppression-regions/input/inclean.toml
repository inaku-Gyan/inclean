[project]
root = "."
version = "0.3.0-alpha.3"
min_inclean_version = "0.3.0-alpha.3"

[[rule]]
name = "rewrite"
file_paths = ["src/**/*"]
include_match = ["**"]
suppression_comments_regex = {
    block_start = "^USER CODE BEGIN.*$",
    block_end = "^USER CODE END.*$",
    line = "^inclean: skip$",
}
action = { type = "replace", with = "lib/${original}" }
