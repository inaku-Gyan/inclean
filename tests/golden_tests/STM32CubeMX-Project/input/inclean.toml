#:schema https://raw.githubusercontent.com/inaku-Gyan/inclean/v0.3.0-alpha.2/schemas/inclean.toml.schema.json

[project]
version = "0.3.0-alpha.2"
min_inclean_version = "0.3.0-alpha.2"


[[rule]]
name = "global"

file_paths = ["**"]

include_directories = ["Inc"]
include_on_unresolved = "skip"

action = { type = "keep" }


[[rule]]
name = "inside-libs"

file_paths = ["**", '!Inc/**', '!Src/**']

include_directories = [
    "Drivers/CMSIS/Device/ST/STM32F4xx/Include",
    "Drivers/CMSIS/Include",
    "Middlewares/Third_Party/FreeRTOS/Source/CMSIS_RTOS_V2",
    "Middlewares/Third_Party/FreeRTOS/Source/include",
    "Middlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CM4F",
]
include_on_unresolved = "skip"
# include_on_ambiguous = "error"

action = { type = "resolve", relative_to = "${current_file}" }


[[rule]]
name = "Drivers"

file_paths = ["Inc/**", "Src/**"]

include_directories = [
    "Drivers/CMSIS/Device/ST/STM32F4xx/Include",
    "Drivers/CMSIS/Include",
]
include_on_unresolved = "skip"

action = { type = "resolve", relative_to = "Drivers", output_form = "angle" }


[[rule]]
name = "Middlewares"
copied_from = "Drivers"

include_directories = [
    "Middlewares/Third_Party/FreeRTOS/Source/CMSIS_RTOS_V2",
    "Middlewares/Third_Party/FreeRTOS/Source/include",
    "Middlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CM4F",
]

action = { type = "resolve", relative_to = "Middlewares", output_form = "angle" }


[[rule]]
name = "export stm32f4xx_hal_*.h"
copied_from = "inside-libs"

file_paths = ["**"]

include_match = ["**/stm32f4xx_hal_*.h"]

trailing_comment = { append_if_absent = "  // IWYU pragma: export" }
