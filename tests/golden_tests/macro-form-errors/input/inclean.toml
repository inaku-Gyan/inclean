[project]
root = "."
version = "0.3.0-alpha.3"
min_inclean_version = "0.3.0-alpha.3"

# v1: matching a macro-form #include forces an Error regardless of the
# declared action. The file is skipped (no partial writes).

[[rule]]
name = "rewrite-quote"
file_paths = ["src/**/*"]
include_forms = ["quote"]
include_match = ["**"]
action = { type = "replace", with = "lib/${original}" }

[[rule]]
name = "rewrite-macro"
file_paths = ["src/**/*"]
include_forms = ["macro"]
include_match = ["**"]
action = { type = "keep" }
