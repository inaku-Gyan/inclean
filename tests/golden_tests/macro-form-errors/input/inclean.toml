[project]
root = "."
version = "0.3.0-alpha.3"
min_inclean_version = "0.3.0-alpha.3"

# Undefined, unsupported, or ambiguous macro-form includes still force an
# unfixable outcome when a non-skip action matches. The whole file is skipped
# (no partial writes), so each source sample keeps its quote include unchanged.

[[rule]]
name = "rewrite-quote"
file_paths = ["src/**/*"]
include_forms = ["quote"]
include_match = ["**"]
action = { type = "replace", with = "lib/${original}" }

[[rule]]
name = "rewrite-macro"
file_paths = ["src/**/*"]
include_forms = ["macro"]
include_match = ["**"]
action = { type = "keep" }
