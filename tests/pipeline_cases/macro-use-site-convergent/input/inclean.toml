[project]
root = "."
version = "0.4.0-alpha.2"
min_inclean_version = "0.4.0-alpha.2"

[[rule]]
name = "collapse identical use-site rewrite"
file_paths = ["src/**/*", "config/**/*"]
macro_rewrite = "use_site"
include_forms = ["quote"]
include_match = ["private_*.h"]
action = { type = "replace", with = "public.h", output_form = "quote" }
