[project]
root = "."
version = "0.4.0-alpha.2"
min_inclean_version = "0.4.0-alpha.2"

[[rule]]
name = "rewrite only quote macro definitions"
file_paths = ["src/**/*", "config/**/*"]
include_forms = ["quote"]
include_match = ["private_*.h"]
action = { type = "replace", with = "normalized/${original}" }
